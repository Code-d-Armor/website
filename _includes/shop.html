<!-- Boutique -->
<section class="band" id="shop">
  <div class="inner">
    <div class="section-head section-head--center reveal">
      <span class="eyebrow">{{ include.params.eyebrow | default: "Nouveauté" }}</span>
      <h2 class="section-title">{{ include.params.title }}</h2>
      <p class="section-intro">{{ include.params.description }}</p>
    </div>
    <div class="shop-grid grid-3 reveal">
      {% for photo in include.params.photos %}
      <div class="shop-item">
        <img src="{{ site.baseurl }}/{{ photo.url }}" alt="{{ photo.alt }}" loading="lazy" decoding="async">
      </div>
      {% endfor %}
    </div>
    {% if include.params.button %}
    <div style="text-align:center;" class="reveal">
      <a href="{{ include.params.button.url }}" class="btn btn-primary" target="{{ include.params.button.target | default: '_blank' }}" rel="noopener">{{ include.params.button.text }}</a>
    </div>
    {% endif %}
  </div>
</section>
