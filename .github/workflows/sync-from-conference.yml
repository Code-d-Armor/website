name: Sync from conference

on:
  # Fired by Code-d-Armor/conference's "Notify website of updates" workflow
  # whenever its master branch is updated.
  repository_dispatch:
    types: [conference-updated]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch conference master
        run: git fetch https://github.com/Code-d-Armor/conference.git master:conference-master

      - name: Merge conference/master into master
        run: |
          if git merge-base --is-ancestor conference-master HEAD; then
            echo "Already up to date, nothing to merge."
            exit 0
          fi

          PRE_MERGE=$(git rev-parse HEAD)

          # Merge, but tolerate conflicts: workflow files are resolved in favour
          # of this repo below, so a conflict there must not abort the run.
          git merge --no-edit conference-master || true

          if [ -f .git/MERGE_HEAD ]; then
            if git ls-files -u -- .github/workflows | grep -q .; then
              echo "Conflit dans .github/workflows : on garde la version de ce dépôt."
              rm -rf .github/workflows
              git checkout "$PRE_MERGE" -- .github/workflows
              git add -A .github/workflows
            fi

            # Anything else conflicting is a real conflict: stop here.
            if git ls-files -u | grep -q .; then
              echo "::error::Conflit hors .github/workflows, merge abandonné."
              git ls-files -u
              git merge --abort || true
              exit 1
            fi

            git commit --no-edit
          fi

          # This repo's own .github/workflows/ always wins: conference has its
          # own unrelated workflows (e.g. notify-website.yml) that don't belong
          # here, and pushing workflow-file changes needs a permission scope
          # the default token doesn't have.
          git rm -r --cached --ignore-unmatch .github/workflows > /dev/null
          rm -rf .github/workflows
          git checkout "$PRE_MERGE" -- .github/workflows
          git add -A .github/workflows
          if ! git diff --cached --quiet -- .github/workflows; then
            git commit --amend --no-edit
          fi

      - name: Push
        run: git push origin HEAD:master
